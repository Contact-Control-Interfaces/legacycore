syntax = "proto3";

//internal packet structures for SDP (host <=> radio) communication

enum SDPOP{
  invalid = 0;  //all proto enums require a 0 first entry
  opHelloMessage = 1;
  opIdentifyMessage = 2;
  opRadioStartMessage = 3;
  opDisconnectMessage = 4;
  opRadioStatusMessage = 5;
  opHostAddressMessage = 6;
  opDeviceAddressMessage = 7;
  opPairedListingMessage = 8;
  opClearPairedMessage = 9;
  opRemovePairMessage = 10;
  opRadioConfigMessage = 11;
};

message SDPHeader{
  fixed32 length = 1;
  fixed32 opcode = 2;
}

message HelloMessage{
  uint32 hostId = 1;
}

message IdentifyMessage{
  uint32 deviceId = 1;
  uint32 capabilities = 2;
}

message RadioStartMessage{
  string name = 1;
}

message DisconnectMessage{}

enum SDPRadioStatus{
  sdp_invalid = 0;
  advertising = 1;
  connected = 2;
  pairing = 4;
  error = 128;
};

message RadioStatusMessage{
  SDPRadioStatus status = 1;
}

message HostAddressMessage{
  bytes address = 1;
}

message DeviceAddressMessage{
  bytes address = 1;
}

message PairedListingMessage{
  bytes addresses = 1;
}

message ClearPairedMessage{}

message RemovePairMessage{
  bytes address = 1;
}

message RadioConfigMessage{
  bytes mfgData = 1;
  uint32 classOfDevice = 2;
  optional string uuid = 3;
}